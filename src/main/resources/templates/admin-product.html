
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Mini Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            color: #222;
        }

        header {
            background: #263b60;
            color: white;
            padding: 18px 30px;
        }

        main {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 7px #dddddd;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        button {
            margin-top: 20px;
            padding: 12px 18px;
            background: #263b60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            color: #c62828;
            background: #ffebee;
            padding: 10px;
            border-radius: 5px;
        }

        a {
            color: #263b60;
        }
    </style>
</head>

<body>
<header>
    <h1>Mini Store - Admin Panel</h1>
</header>

<main>
    <h2>Add New Product</h2>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/admin/products/add}" method="post">

        <label for="name">Product Name</label>
        <input type="text" id="name" name="name"
               placeholder="Enter product name" required>

        <label for="description">Description</label>
        <textarea id="description" name="description"
                  rows="3" placeholder="Enter product description"
                  required></textarea>

        <label for="price">Price (₹)</label>
        <input type="number" id="price" name="price"
               min="0.01" step="0.01"
               placeholder="Enter price" required>

        <label for="stock">Available Stock</label>
        <input type="number" id="stock" name="stock"
               min="0" step="1"
               placeholder="Enter stock quantity" required>

        <label for="categoryId">Category</label>
        <select id="categoryId" name="categoryId" required>
            <option value="">Select a category</option>
            <option th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}">
            </option>
        </select>

        <button type="submit">Add Product</button>
    </form>

    <p><a th:href="@{/products}">Back to Products</a></p>
</main>
</body>
</html>
