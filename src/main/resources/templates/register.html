
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Mini Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 420px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #cccccc;
        }

        h1 {
            text-align: center;
            color: #263b60;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 22px;
            background: #263b60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            color: #c62828;
            margin-top: 12px;
        }

        .link {
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        <p>Register to start shopping at Mini Store.</p>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <label for="name">Full Name</label>
            <input type="text" id="name" th:field="*{name}" required>
            <p class="error" th:if="${#fields.hasErrors('name')}"
               th:errors="*{name}"></p>

            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" required>
            <p class="error" th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"></p>

            <label for="password">Password</label>
            <input type="password" id="password"
                   th:field="*{password}" required minlength="4">
            <p class="error" th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}"></p>

            <label for="dateOfBirth">Date of Birth</label>
            <input type="date" id="dateOfBirth"
                   th:field="*{dateOfBirth}" required>
            <p class="error" th:if="${#fields.hasErrors('dateOfBirth')}"
               th:errors="*{dateOfBirth}"></p>

            <button type="submit">Register</button>
        </form>

        <div class="link">
            Already have an account?
            <a th:href="@{/login}">Login here</a>
        </div>
    </div>
</body>
</html>
